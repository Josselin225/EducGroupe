{% extends "base.html" %}
{% block icon %}fas fa-tags{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><i class="fas fa-tags me-2 text-primary"></i>{{ page_title }}</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
            {{ form.nom }}
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Catégorie</label>
              {{ form.type_frais }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Montant (FCFA) <span class="text-danger">*</span></label>
              {{ form.montant }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Année scolaire</label>
            {{ form.annee_scolaire }}
          </div>
          <div class="mb-3 form-check">
            {{ form.obligatoire }}
            <label class="form-check-label fw-semibold">Frais obligatoire</label>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            {{ form.description }}
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'paiements:types_frais_liste' %}" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
