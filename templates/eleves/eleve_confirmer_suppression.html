{% extends "base.html" %}
{% block icon %}fas fa-user-times{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-warning">
      <div class="card-header text-warning"><i class="fas fa-exclamation-triangle me-2"></i>Confirmer la désactivation</div>
      <div class="card-body text-center py-4">
        <i class="fas fa-user-graduate fa-3x text-warning opacity-50 mb-3"></i>
        <p class="mb-1">Voulez-vous désactiver l'élève :</p>
        <h5 class="fw-bold mb-1">{{ eleve.nom_complet }}</h5>
        <code class="text-muted">{{ eleve.matricule }}</code>
        <p class="text-muted small mt-3">L'élève sera marqué comme inactif (pas supprimé).</p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-3">
          {% csrf_token %}
          <a href="{% url 'eleves:index' %}" class="btn btn-outline-secondary">Annuler</a>
          <button type="submit" class="btn btn-warning"><i class="fas fa-user-times me-1"></i>Désactiver</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
