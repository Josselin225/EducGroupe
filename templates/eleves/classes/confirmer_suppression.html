{% extends "base.html" %}
{% block icon %}fas fa-trash{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-danger">
      <div class="card-header text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Confirmer la suppression</div>
      <div class="card-body text-center py-4">
        <i class="fas fa-door-open fa-3x text-danger opacity-50 mb-3"></i>
        <p class="mb-1">Voulez-vous supprimer la classe :</p>
        <h5 class="fw-bold text-danger mb-3">{{ classe.nom }}</h5>
        <p class="text-muted small">Les élèves de cette classe seront désaffectés.</p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-3">
          {% csrf_token %}
          <a href="{% url 'eleves:classes_liste' %}" class="btn btn-outline-secondary">Annuler</a>
          <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i>Supprimer</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
